services:
  codecoach:
    build: .
    image: codecoach
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    env_file: .env.local
    environment:
      NODE_ENV: production
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./data/uploads:/app/uploads
